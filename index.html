<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;min-height:100vh}
h1{font-size:18px;margin-bottom:16px;text-align:center}
.card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:10px}
.card .title{font-size:15px;font-weight:700;margin-bottom:6px}
.card .meta{font-size:12px;color:#94a3b8;margin-bottom:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin:2px}
.tag.on{background:#065f46;color:#6ee7b7}
.tag.off{background:#78350f;color:#fbbf24}
.tag.cont{background:#1e3a5f;color:#93c5fd}
ul{list-style:none;font-size:13px;color:#cbd5e1}
ul li{padding:3px 0;padding-left:14px;position:relative}
ul li:before{content:'·';position:absolute;left:0;color:#4F46E5}
.foot{text-align:center;font-size:11px;color:#475569;margin-top:14px}
</style>
</head>
<body>
<h1>📊 项目仪表盘</h1>

<div class="card">
<div class="title">🔴 见英雄关公巡展</div>
<div class="meta">概念方案阶段 · 5脚本已深化</div>
<ul>
<li>青龙偃月刀测力交互</li>
<li>武圣长卷VR</li>
<li>关公生平编年地图</li>
<li>十三刀体感互动</li>
<li>赤面千秋互动皮影</li>
</ul>
<span class="tag on">进行中</span><span class="tag cont">HTML仪表盘</span>
</div>

<div class="card">
<div class="title">🟡 古建大家柴泽俊</div>
<div class="meta">新建 · 1份参考资料docx</div>
<span class="tag off">待启动</span>
</div>

<div class="card">
<div class="title">🔴 山西博物院公众号</div>
<div class="meta">4子目录（需求/后台/内容/会议）</div>
<span class="tag off">待开发</span>
</div>

<div class="card">
<div class="title">🟢 日常方案报价</div>
<span class="tag cont">持续中</span>
</div>

<div class="foot">正方形 · 5月29日</div>
</body>
</html>
